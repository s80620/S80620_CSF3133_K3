<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket Booking</title>
</head>
<body>
    <!-- ERRORS FOUND IN ORIGINAL CODE:
         1. Line 1: Incomplete DOCTYPE. Use <!DOCTYPE html>.
         2. Line 9: Incorrect nesting of h1 and span.
         3. Line 11: Used span for content section instead of div.
         4. Line 13: Reserved < symbol must use &lt;.
         5. Line 13: Ampersand must use &amp;.
         6. Line 14: String concatenation instead of numeric addition.
         7. Line 18: "emial" should be "email"; add required.
         8. Lines 22-26: Datalist ID does not match input list.
         9. Line 32: Range min and max are reversed.
        10. Line 33: Incorrect output for attribute.
        11. Line 38: &Copy; should be &copy;.
        12. Lines 54-55: Duplicate closing body and html tags.
        13. Extended: Added phone, show time, sidebar and price output.
    -->

<div id="header">
    <h1>e-Ticket <span>Your Campus Cinema</span></h1>
</div>

<div id="content">
    <h2>Book Your Ticket</h2>
    <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>
    
    <form action="booking.php" oninput="total.value = parseInt(adult.value || 0) + parseInt(child.value || 0)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"><br>

        <label for="date">Show date:</label>
        <input type="date" id="date" name="date"><br>

        <label for="movie">Movie:</label>
        <input id="movie" name="movie" list="movies"><br>
        <datalist id="movies">
            <option value="Space Rangers">
            <option value="Kampung Comedy">
        </datalist><br>

        <label for="adult">Adult tickets:</label>
        <input type="number" id="adult" name="adult" value="0"><br>

        <label for="child">Child tickets:</label>
        <input type="number" id="child" name="child" value="0"><br>

        <!-- Rating -->
        <label for="rating">Rate our service:</label>

        <input type="range" id="rating"
            name="rating"
            min="1"
            max="5"
            step="1"
            value="3"
            oninput="ratingOutput.value = rating.value">
        <output name="ratingOutput" id="ratingOutput"
            for="rating">3</output>

<br><br>

        Total tickets: <output name="total" for="adult child">0</output><br>

        <input type="submit" value="Book Now">
    </form>
</div>

<div id="footer">
    <p>&copy; 2026 CineKampus. All rights reserved.</p>
</div>

</body>
</html>
