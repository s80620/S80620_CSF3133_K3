<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input HTML5</title>
</head>
<body>
    <form action="">
        Pilih warna kegemaran anda: <input type="color" name="favcolor" value="#ff0000">
        <br>
        Carian: <input type="search" name="search">
        <br>
        Tarikh: <input type="date" name="tarikh">
        <br>
        Masa: <input type="time" name="masa">
        <br>
        Bulan dan Tahun: <input type="month" name="Oktober">
        <br>
        Laman web: <input type="url" name="lamanweb">
        <br>
        Minggu: <input type="week" name="minggu">
        <br>
        Email: <input type="email" name="email">
        <br>
        <input type="submit" value="Hantar">
    </form>
</body>
</html>
